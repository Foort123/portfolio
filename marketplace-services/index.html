<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PALATOVDA — Marketplace услуг</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --p: #6C5CE7; --p2: #5A4BD1; --pl: #EEEAFF; --a: #F59E0B;
  --s: #10B981; --d: #EF4444; --bg: #F8FAFC; --w: #fff;
  --t: #0F172A; --ts: #64748B; --tm: #94A3B8; --b: #E2E8F0;
  --sh: 0 1px 3px rgba(0,0,0,.08); --shm: 0 4px 20px rgba(0,0,0,.1);
  --r: 12px; --rs: 8px; --rl: 16px; --f: 'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);color:var(--t);background:var(--bg);font-size:15px;line-height:1.5;overflow-x:hidden}
a{color:var(--p);text-decoration:none}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;outline:none}
.container{max-width:1200px;margin:0 auto;padding:0 20px}

/* Header */
.header{background:var(--w);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:100}
.header-inner{display:flex;align-items:center;gap:20px;padding:12px 0;max-width:1200px;margin:0 auto;padding:12px 20px}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo-icon{width:40px;height:40px;border-radius:10px;background:var(--p);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;box-shadow:0 4px 12px rgba(108,92,231,.3)}
.logo-text{font-weight:700;font-size:18px;letter-spacing:.5px}
.logo-sub{font-size:10px;color:var(--tm);letter-spacing:1.5px;margin-top:1px}
.header-search{flex:1;max-width:400px;position:relative}
.header-search input{width:100%;padding:10px 16px 10px 40px;border:2px solid var(--b);border-radius:var(--rs);background:var(--bg);font-size:14px;transition:.2s}
.header-search input:focus{border-color:var(--p);background:var(--w)}
.header-search .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--tm)}
.header-actions{display:flex;gap:10px;align-items:center;margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:var(--rs);font-size:14px;font-weight:600;border:none;cursor:pointer;transition:all .25s;text-decoration:none}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shm)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--p);color:#fff}
.btn-primary:hover{background:var(--p2)}
.btn-outline{background:transparent;border:2px solid var(--b);color:var(--t)}
.btn-outline:hover{border-color:var(--p);color:var(--p)}
.btn-ghost{background:transparent;color:var(--ts)}
.btn-ghost:hover{background:var(--bg);color:var(--t)}
.btn-sm{padding:7px 14px;font-size:13px}
.btn-lg{padding:14px 28px;font-size:16px}
.btn-accent{background:var(--a);color:#fff}
.btn-accent:hover{background:#D97706}
.btn-icon{width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:var(--rs)}

/* Cards */
.card{background:var(--w);border-radius:var(--r);border:1px solid var(--b);overflow:hidden;transition:all .3s}
.card:hover{box-shadow:var(--shm);transform:translateY(-2px)}
.card-body{padding:20px}
.grid{display:grid;gap:20px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}

/* Avatar */
.avatar{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#fff;flex-shrink:0}
.avatar-sm{width:40px;height:40px;font-size:14px}
.avatar-lg{width:80px;height:80px;font-size:28px}
.avatar-xl{width:120px;height:120px;font-size:40px}

/* Stars */
.stars{display:flex;gap:2px;color:var(--a);font-size:14px}
.rating-text{font-size:13px;color:var(--ts);margin-left:6px}

/* Section */
.section{padding:40px 0}
.section-title{font-size:24px;font-weight:700;margin-bottom:6px}
.section-sub{color:var(--ts);margin-bottom:24px}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.section-header .section-title{margin-bottom:0}

/* Status badges */
.badge{display:inline-flex;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}
.badge-p{p{background:var(--pl);color:var(--p)}}
.badge-s{background:#D1FAE5;color:#065F46}
.badge-w{background:#FEF3C7;color:#92400E}
.badge-d{background:#FEE2E2;color:#991B1B}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s}
.modal{background:var(--w);border-radius:var(--rl);padding:32px;width:90%;max-width:440px;max-height:90vh;overflow-y:auto;animation:slideUp .3s}
.modal-title{font-size:20px;font-weight:700;margin-bottom:8px;text-align:center}
.modal-sub{color:var(--ts);text-align:center;margin-bottom:24px;font-size:14px}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;font-size:24px;cursor:pointer;color:var(--tm)}

/* Forms */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--ts);margin-bottom:6px}
.form-input{width:100%;padding:12px 16px;border:2px solid var(--b);border-radius:var(--rs);font-size:15px;transition:.2s}
.form-input:focus{border-color:var(--p)}
.form-select{width:100%;padding:12px 16px;border:2px solid var(--b);border-radius:var(--rs);font-size:15px;background:var(--w);cursor:pointer}
textarea.form-input{min-height:100px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* Search hero */
.hero{background:linear-gradient(135deg,var(--p) 0%,#8B7CF7 100%);padding:60px 0;text-align:center;color:#fff;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");opacity:.4}
.hero-content{position:relative;z-index:1;max-width:700px;margin:0 auto}
.hero h1{font-size:36px;font-weight:800;margin-bottom:8px}
.hero p{font-size:18px;opacity:.9;margin-bottom:28px}
.hero-search{display:flex;gap:12px;max-width:560px;margin:0 auto;background:var(--w);border-radius:var(--r);padding:6px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
.hero-search input{flex:1;border:none;padding:12px 16px;font-size:16px}
.hero-search .btn{padding:12px 28px;font-size:15px;border-radius:var(--rs)}
.hero-tags{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.hero-tag{background:rgba(255,255,255,.15);padding:8px 16px;border-radius:20px;font-size:13px;cursor:pointer;transition:.2s}
.hero-tag:hover{background:rgba(255,255,255,.25)}

/* Category cards */
.cat-card{display:flex;flex-direction:column;align-items:center;padding:24px 16px;text-align:center;cursor:pointer}
.cat-icon{width:56px;height:56px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:12px}
.cat-name{font-weight:600;font-size:15px}
.cat-count{font-size:12px;color:var(--tm);margin-top:4px}

/* Specialist card */
.spec-card .card-body{padding:20px}
.spec-card-top{display:flex;gap:16px;align-items:flex-start;margin-bottom:12px}
.spec-info{flex:1}
.spec-name{font-weight:700;font-size:16px;margin-bottom:2px}
.spec-prof{font-size:13px;color:var(--ts)}
.spec-meta{display:flex;gap:16px;margin-top:8px;font-size:13px;color:var(--ts)}
.spec-price{font-weight:700;color:var(--p);font-size:18px;margin-top:8px}
.spec-desc{font-size:13px;color:var(--ts);margin-top:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.spec-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.spec-tag{padding:3px 10px;border-radius:12px;background:var(--pl);color:var(--p);font-size:12px}
.verified{color:var(--s);font-size:13px;display:flex;align-items:center;gap:4px;margin-top:4px}

/* Order card */
.order-card{padding:20px;cursor:pointer}
.order-title{font-weight:600;font-size:16px;margin-bottom:6px}
.order-meta{display:flex;gap:20px;font-size:13px;color:var(--ts);margin-top:8px}
.order-budget{font-weight:700;color:var(--p);font-size:15px}

/* Filters */
.filters{background:var(--w);border-radius:var(--r);border:1px solid var(--b);padding:24px}
.filter-title{font-weight:600;font-size:14px;margin-bottom:12px;margin-top:20px}
.filter-title:first-child{margin-top:0}
.filter-group{margin-bottom:16px}
.filter-label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--t);padding:6px 0;cursor:pointer}
.filter-label input[type="checkbox"]{accent-color:var(--p);width:16px;height:16px}
.range-inputs{display:flex;gap:8px}
.range-inputs input{width:100%;padding:8px 12px;border:2px solid var(--b);border-radius:var(--rs);font-size:14px}

/* Profile page */
.profile-header{background:var(--w);border-radius:var(--rl);border:1px solid var(--b);padding:32px}
.profile-top{display:flex;gap:24px;align-items:flex-start}
.profile-info{flex:1}
.profile-name{font-size:28px;font-weight:700;margin-bottom:4px}
.profile-prof{font-size:16px;color:var(--ts);margin-bottom:8px}
.profile-actions{display:flex;gap:12px;margin-top:16px}
.profile-section{margin-top:32px}
.profile-section-title{font-size:18px;font-weight:700;margin-bottom:16px}
.skills{display:flex;gap:8px;flex-wrap:wrap}
.skill{padding:6px 14px;background:var(--pl);color:var(--p);border-radius:20px;font-size:13px;font-weight:500}
.portfolio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.portfolio-item{aspect-ratio:4/3;background:linear-gradient(135deg,var(--pl),#ddd6fe);border-radius:var(--rs);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--p);font-weight:500}

/* Dashboard */
.dashboard{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 64px)}
.sidebar{background:var(--w);border-right:1px solid var(--b);padding:24px 0}
.sidebar-item{display:flex;align-items:center;gap:12px;padding:12px 24px;color:var(--ts);cursor:pointer;transition:.2s;font-size:14px;font-weight:500}
.sidebar-item:hover,.sidebar-item.active{background:var(--pl);color:var(--p)}
.sidebar-item .icon{width:20px;text-align:center}
.dash-content{padding:32px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px}
.stat-card{background:var(--w);border-radius:var(--r);border:1px solid var(--b);padding:20px}
.stat-value{font-size:28px;font-weight:700}
.stat-label{font-size:13px;color:var(--ts);margin-top:4px}
.stat-change{font-size:12px;color:var(--s);margin-top:4px}

/* Chat */
.chat-page{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 64px)}
.chat-list{background:var(--w);border-right:1px solid var(--b);overflow-y:auto}
.chat-item{display:flex;gap:12px;padding:16px 20px;cursor:pointer;border-bottom:1px solid var(--b);transition:.2s}
.chat-item:hover,.chat-item.active{background:var(--pl)}
.chat-item-info{flex:1;min-width:0}
.chat-item-name{font-weight:600;font-size:14px}
.chat-item-msg{font-size:13px;color:var(--ts);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item-time{font-size:11px;color:var(--tm)}
.chat-area{display:flex;flex-direction:column;background:var(--bg)}
.chat-header{padding:16px 24px;background:var(--w);border-bottom:1px solid var(--b);display:flex;align-items:center;gap:12px}
.chat-messages{flex:1;overflow-y:auto;padding:24px}
.msg{max-width:70%;margin-bottom:16px;padding:12px 16px;border-radius:var(--r);font-size:14px}
.msg-incoming{background:var(--w);border:1px solid var(--b);border-bottom-left-radius:4px}
.msg-outgoing{background:var(--p);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.msg-time{font-size:11px;opacity:.7;margin-top:4px;text-align:right}
.chat-input-area{display:flex;gap:12px;padding:16px 24px;background:var(--w);border-top:1px solid var(--b)}
.chat-input-area input{flex:1;padding:12px 16px;border:2px solid var(--b);border-radius:var(--rs);font-size:14px}
.chat-input-area input:focus{border-color:var(--p)}

/* Admin */
.admin-layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 64px)}
.admin-sidebar{background:#1E293B;color:#fff;padding:24px 0}
.admin-sidebar .sidebar-item{color:#94A3B8}
.admin-sidebar .sidebar-item:hover,.admin-sidebar .sidebar-item.active{background:#334155;color:#fff}

/* Table */
.table-wrap{background:var(--w);border-radius:var(--r);border:1px solid var(--b);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{padding:12px 16px;text-align:left;font-size:12px;font-weight:600;color:var(--ts);text-transform:uppercase;letter-spacing:.5px;background:var(--bg);border-bottom:1px solid var(--b)}
td{padding:12px 16px;border-bottom:1px solid var(--b);font-size:14px}
tr:last-child td{border-bottom:none}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px}

/* Notifications */
.toast{position:fixed;bottom:24px;right:24px;background:#1E293B;color:#fff;padding:14px 20px;border-radius:var(--rs);box-shadow:var(--shm);z-index:2000;animation:slideUp .3s;font-size:14px;max-width:360px}

/* Animations */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.page-enter{animation:slideUp .35s ease}
.skeleton{background:linear-gradient(90deg,var(--b) 25%,#f1f5f9 50%,var(--b) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--rs)}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Back btn */
.back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--ts);font-size:14px;cursor:pointer;margin-bottom:16px;background:none;border:none}
.back-btn:hover{color:var(--t)}

/* Tabs */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--b);margin-bottom:24px}
.tab{padding:12px 24px;font-size:14px;font-weight:500;color:var(--ts);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:.2s}
.tab:hover{color:var(--t)}
.tab.active{color:var(--p);border-color:var(--p)}

/* Page layout */
.page{padding:32px 0}
.page-title{font-size:28px;font-weight:700;margin-bottom:6px}
.page-sub{color:var(--ts);margin-bottom:32px}

/* Search results layout */
.search-layout{display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start}

/* Responsive */
@media(max-width:1024px){
  .grid-4{grid-template-columns:repeat(3,1fr)}
  .search-layout{grid-template-columns:1fr}
  .dashboard{grid-template-columns:1fr}
  .admin-layout{grid-template-columns:1fr}
  .chat-page{grid-template-columns:1fr}
  .chat-list{display:none}
}
@media(max-width:768px){
  .grid-3,.grid-4{grid-template-columns:repeat(2,1fr)}
  .hero h1{font-size:24px}
  .hero p{font-size:15px}
  .header-search{display:none}
  .header-actions .btn span{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
  .profile-top{flex-direction:column;align-items:center;text-align:center}
  .profile-actions{justify-content:center}
  .form-row{grid-template-columns:1fr}
  .page{padding:20px 0}
  .section{padding:24px 0}
  .sidebar{display:none}
  .dash-content{padding:16px}
  .mobile-sidebar-btn{display:flex!important}
}
@media(max-width:480px){
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .hero-search{flex-direction:column}
  .container{padding:0 12px}
  .modal{padding:24px 20px}
}
.mobile-sidebar-btn{display:none;background:none;border:none;font-size:24px;cursor:pointer;padding:4px;color:var(--t)}
</style>
</head>
<body>

<div id="app">
  <div id="header"></div>
  <div id="content"></div>
  <div id="modal"></div>
  <div id="toast"></div>
</div>

function hStar(r){
  let s='';const f=Math.floor(r);
  for(let i=0;i<5;i++)s+=i<f?'★':i<r?'★':String.fromCharCode(9734);
  return `<span class="stars">${s}</span>`;
}

      ${C.chatOpen?(()=>{const ch=CHATS.find(c=>c.id===C.chatOpen);if(!ch)return'<div style="display:flex;align-items:center;justify-content:center;flex:1;color:var(--tm)">Выберите чат</div>';
      return`
      <div class="chat-header">
        ${avatar(ch.name,'avatar-sm')}
        <div>
          <div style="font-weight:600">${ch.name}</div>
          <div style="font-size:12px;color:var(--s)">${ch.online?'Онлайн':'Был(а) недавно'}</div>
        </div>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="msg msg-incoming">Здравствуйте! Меня заинтересовала ваша заявка.<div class="msg-time">${ch.time}</div></div>
        <div class="msg msg-outgoing">Здравствуйте! Расскажите подробнее о вашем предложении.<div class="msg-time">${ch.time}</div></div>
        <div class="msg msg-incoming">${ch.msg}<div class="msg-time">${ch.time}</div></div>
      </div>
      <div class="chat-input-area">
        <input placeholder="Напишите сообщение..." id="chatInput" onkeydown="if(event.key==='Enter')sendChat()">
        <button class="btn btn-primary btn-icon" onclick="sendChat()">➤</button>
        <button class="btn btn-outline btn-icon">📎</button>
      </div>`;})():`
      <div style="display:flex;align-items:center;justify-content:center;flex:1;flex-direction:column;color:var(--tm)">
        <div style="font-size:48px;margin-bottom:12px">💬</div>
        <div style="font-size:18px;font-weight:600;color:var(--t);margin-bottom:4px">Выберите диалог</div>
        <div style="font-size:14px">Нажмите на чат слева, чтобы начать общение</div>
      </div>`}
    </div>
  </div>`;
}
function sendChat(){
  const inp=document.getElementById('chatInput');
  if(!inp||!inp.value.trim())return;
  const area=document.getElementById('chatMessages');
  if(!area)return;
  const now=new Date();
  const time=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  area.innerHTML+=`<div class="msg msg-outgoing">${inp.value}<div class="msg-time">${time}</div></div>`;
  inp.value='';
  area.scrollTop=area.scrollHeight;
  setTimeout(()=>{
    const msgs=document.getElementById('chatMessages');
    if(!msgs)return;
    msgs.innerHTML+=`<div class="msg msg-incoming">Спасибо! Скоро свяжусь с вами по вашему вопросу.<div class="msg-time">${time}</div></div>`;
    msgs.scrollTop=msgs.scrollHeight;
  },1500);
}

function render(){
  renderHeader();

  const r=C.route;
  if(r==='home')html=pageHome();
  else if(r==='search')html=pageSearch();
  else if(r.startsWith('spec-'))html=pageSpecialist(parseInt(r.split('-')[1]));
  else if(r==='create-order')html=pageCreateOrder();
  else if(r==='client-dashboard')html=pageClientDashboard();
  else if(r==='spec-dashboard')html=pageSpecDashboard();
  else if(r==='chat')html=pageChat();
  else if(r==='admin')html=pageAdmin();
  else html=pageHome();
  document.getElementById('content').innerHTML=html;
}
