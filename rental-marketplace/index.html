<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>КвартираСутки — аренда квартир посуточно</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --brand:#5B4FEC; --brand-d:#4A3DDE; --brand-l:#F1F0FE; --teal:#34B4D6;
  --ink-900:#12121A; --ink-700:#2C2C3A; --ink-500:#6B6B7B; --ink-300:#B8B8C2; --ink-100:#EEEEF2; --ink-50:#F7F7FA;
  --success:#17A673; --sale:#F0304D; --w:#fff;
  --r:14px; --rl:20px; --sh:0 1px 3px rgba(18,18,26,.06); --shm:0 8px 28px rgba(18,18,26,.10);
  --f:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);color:var(--ink-900);background:var(--ink-50);font-size:15px;line-height:1.5;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;outline:none}
.container{max-width:1180px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;gap:6px;justify-content:center;border:none;border-radius:999px;padding:10px 20px;font-weight:600;font-size:14px;cursor:pointer;transition:.2s}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-d)}
.btn-outline{background:transparent;border:1.5px solid var(--ink-100);color:var(--ink-700)}
.btn-outline:hover{border-color:var(--brand)}
.btn-ghost{background:transparent;color:var(--ink-700)}
.btn-sm{padding:8px 14px;font-size:13px}
.card{background:var(--w);border:1px solid var(--ink-100);border-radius:var(--rl);box-shadow:var(--sh);transition:.3s}
.card:hover{box-shadow:var(--shm);transform:translateY(-2px)}
.badge{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600}
.badge-ok{background:rgba(23,166,115,.1);color:var(--success)}
.badge-pending{background:var(--ink-100);color:var(--ink-700)}
.badge-rej{background:rgba(240,48,77,.1);color:var(--sale)}
.stars{color:var(--brand);letter-spacing:1px}
.grid{display:grid;gap:24px}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid-3,.grid-4{grid-template-columns:1fr}}

/* Header */
.header{background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--ink-100);position:sticky;top:0;z-index:100}
.header-inner{display:flex;align-items:center;gap:20px;max-width:1180px;margin:0 auto;padding:14px 20px}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0;font-weight:700;font-size:17px}
.logo-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--teal));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.header-search{flex:1;max-width:360px}
.header-search input{width:100%;padding:9px 16px;border:1.5px solid var(--ink-100);border-radius:999px;background:var(--ink-50);font-size:13px}
.header-actions{display:flex;align-items:center;gap:10px;flex-shrink:0;font-size:14px}
.header-actions a{color:var(--ink-700);font-weight:500}
.header-actions a:hover{color:var(--brand)}

/* Hero */
.hero{background:linear-gradient(120deg,#2B2575 0%,#4A3DDE 40%,#34B4D6 100%);color:#fff;padding:70px 20px;text-align:center}
.hero h1{font-size:42px;font-weight:800;max-width:640px;margin:0 auto 14px;line-height:1.2}
.hero p{color:rgba(255,255,255,.82);font-size:17px;margin-bottom:34px}
.search-form{max-width:760px;margin:0 auto;background:#fff;border-radius:var(--rl);padding:16px;box-shadow:var(--shm)}
.search-form .row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:700px){.search-form .row{grid-template-columns:1fr 1fr}}
.search-form input,.search-form select{padding:10px 12px;border:1.5px solid var(--ink-100);border-radius:10px;font-size:13px;color:var(--ink-900)}
.search-form .btn{width:100%;margin-top:10px;padding:12px}
.hero-links{margin-top:22px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.hero-links a{padding:9px 18px;border-radius:999px;font-size:13px;font-weight:600;border:1.5px solid rgba(255,255,255,.4);color:#fff}
.hero-links a.solid{background:#fff;color:var(--brand-d);border:none}

/* Sections */
.section{padding:56px 20px;max-width:1180px;margin:0 auto}
.section h2{font-size:22px;font-weight:700;margin-bottom:22px}
.city-pill{display:block;text-align:center;padding:22px;border-radius:var(--rl)}
.city-pill:hover{transform:translateY(-2px)}

/* Listing card */
.l-card{overflow:hidden;display:flex;flex-direction:column}
.l-card .ph{position:relative;height:170px;overflow:hidden;background:var(--ink-100)}
.l-card .ph img{width:100%;height:100%;object-fit:cover;transition:.4s}
.l-card:hover .ph img{transform:scale(1.06)}
.l-card .body{padding:18px}
.l-card .price{font-weight:700;font-size:16px;margin-top:10px}
.l-card .meta{color:var(--ink-500);font-size:13px;margin-bottom:6px}
.fav{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer}

/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px;background:#fff;border:1px solid var(--ink-100);border-radius:var(--rl);padding:16px}
.filters select,.filters input{padding:9px 12px;border:1.5px solid var(--ink-100);border-radius:10px;font-size:13px}

/* Listing detail */
.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;border-radius:var(--rl);overflow:hidden;height:380px;margin-bottom:30px}
.gallery img{width:100%;height:100%;object-fit:cover}
.gallery a:first-child{grid-row:1/3}
@media(max-width:700px){.gallery{grid-template-columns:1fr;grid-template-rows:220px;height:auto}.gallery a:nth-child(n+2){display:none}}
.detail-grid{display:grid;grid-template-columns:2fr 1fr;gap:36px}
@media(max-width:850px){.detail-grid{grid-template-columns:1fr}}
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;font-size:14px;color:var(--ink-700);margin:16px 0 26px}
@media(max-width:600px){.chars{grid-template-columns:1fr 1fr}}
.amen{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:30px}
.amen span{background:var(--ink-50);padding:6px 14px;border-radius:999px;font-size:13px}
.map-box{height:220px;border-radius:var(--rl);background:linear-gradient(135deg,#eef1ff,#e3f6fb);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink-500);font-size:13px;border:1px dashed var(--ink-300);margin-bottom:30px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px;margin-bottom:30px}
.cal span.wd{color:var(--ink-500);padding:4px 0}
.cal span.d{padding:8px 0;border-radius:8px}
.cal span.free{background:rgba(23,166,115,.08);color:var(--success)}
.cal span.busy{background:var(--ink-100);color:var(--ink-300);text-decoration:line-through}
.booking-box{position:sticky;top:90px;padding:22px}
.booking-box .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.booking-box input{padding:9px;border:1.5px solid var(--ink-100);border-radius:10px;font-size:13px;width:100%}
.review{padding:16px 0;border-bottom:1px solid var(--ink-100)}
.review:last-child{border:none}

/* Dashboard */
.stat{padding:20px}
.stat .v{font-size:22px;font-weight:800}
.stat .l{color:var(--ink-500);font-size:13px;margin-top:4px}
.row-item{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:16px;background:#fff;border:1px solid var(--ink-100);border-radius:var(--r);margin-bottom:10px}
.tabs{display:flex;gap:8px;margin-bottom:20px}
.tab{padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid var(--ink-100);color:var(--ink-700)}
.tab.active{background:var(--ink-900);color:#fff;border-color:var(--ink-900)}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--r);overflow:hidden}
table th{text-align:left;padding:12px 16px;color:var(--ink-500);font-size:12px;border-bottom:1px solid var(--ink-100)}
table td{padding:12px 16px;font-size:13px;border-bottom:1px solid var(--ink-50)}

/* Modal & toast */
.modal-overlay{position:fixed;inset:0;background:rgba(18,18,26,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal{background:#fff;border-radius:var(--rl);padding:28px;max-width:360px;width:100%}
.modal input{width:100%;padding:10px 12px;border:1.5px solid var(--ink-100);border-radius:10px;margin-bottom:10px;font-size:14px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink-900);color:#fff;padding:12px 22px;border-radius:999px;font-size:13px;z-index:300}
footer{text-align:center;padding:30px;color:var(--ink-500);font-size:13px;border-top:1px solid var(--ink-100)}
</style>
</head>
<body>
<div id="header"></div>
<div id="content"></div>
<div id="modal"></div>
<div id="toast"></div>
<footer>КвартираСутки — демо-прототип сервиса аренды квартир.</footer>

<script>
// ===== MOCK DATA =====
const CITIES = ['Москва','Санкт-Петербург','Сочи','Казань'];
const LISTINGS = [
  {id:1,title:'Уютная квартира в центре Москвы',city:'Москва',cat:'Квартира',price:4500,rating:5,reviews:12,guests:4,rooms:2,beds:2,area:55,floor:'7/16',view:'На город',balcony:true,elevator:true,amen:['Wi-Fi','Кондиционер','Холодильник','Телевизор','Стиральная машина','Кухня'],photos:[0,1,2,3],desc:'Светлая квартира с видом на город, рядом метро, все удобства для комфортного отдыха.'},
  {id:2,title:'Студия у Невского проспекта',city:'Санкт-Петербург',cat:'Студия',price:3200,rating:4.7,reviews:8,guests:2,rooms:1,beds:1,area:28,floor:'3/5',view:'Во двор',balcony:false,elevator:false,amen:['Wi-Fi','Холодильник','Телевизор','Кухня'],photos:[4,5,6],desc:'Компактная студия для пары, до всех достопримечательностей пешком.'},
  {id:3,title:'Дом с видом на море в Сочи',city:'Сочи',cat:'Дом',price:9000,rating:4.9,reviews:21,guests:8,rooms:4,beds:5,area:140,floor:'1/2',view:'На море',balcony:true,elevator:false,amen:['Wi-Fi','Кондиционер','Холодильник','Телевизор','Стиральная машина','Посудомойка','Парковка','Кухня'],photos:[7,8,9,10],desc:'Просторный дом для всей семьи, 5 минут до пляжа, есть терраса.'},
  {id:4,title:'Апартаменты у Казанского Кремля',city:'Казань',cat:'Апартаменты',price:3800,rating:4.6,reviews:5,guests:3,rooms:1,beds:2,area:40,floor:'5/9',view:'Не указан',balcony:false,elevator:true,amen:['Wi-Fi','Телевизор','Кухня'],photos:[11,12,13],desc:'Новая квартира с ремонтом рядом с историческим центром.'},
  {id:5,title:'Лофт в центре Санкт-Петербурга',city:'Санкт-Петербург',cat:'Квартира',price:5200,rating:4.8,reviews:17,guests:4,rooms:2,beds:2,area:62,floor:'4/6',view:'На город',balcony:true,elevator:true,amen:['Wi-Fi','Кондиционер','Телевизор','Стиральная машина','Кухня'],photos:[14,15,16],desc:'Стильный лофт с высокими потолками в шаговой доступности от центра.'},
  {id:6,title:'Дом у подножия гор в Сочи',city:'Сочи',cat:'Дом',price:7600,rating:4.9,reviews:14,guests:6,rooms:3,beds:4,area:110,floor:'1/1',view:'На горы',balcony:true,elevator:false,amen:['Wi-Fi','Кондиционер','Парковка','Кухня'],photos:[17,18,19],desc:'Тихий дом с видом на горы, идеален для отдыха вдали от суеты.'}
];
const REVIEW_TEXTS = ['Отличная квартира, всё как на фото!','Очень чисто и уютно, обязательно вернёмся.','Хозяин на связи, заезд без проблем.','Прекрасное расположение, рядом всё необходимое.'];
// Local photos (downloaded once, reviewed for suitability) instead of hotlinking an
// external image API — keeps the preview fast and reliable regardless of network conditions.
const PHOTO_FILES = ['1076','1029','431','43','43','164','1067','296','380','1076','1029','1029','431','43','164','1067','296','380','1076','1029'];
const photoUrl = n => `./photos/p${PHOTO_FILES[n]}.jpg`;
const getListing = id => LISTINGS.find(l => l.id == id);
const stars = r => { let s=''; const f=Math.floor(r); for(let i=0;i<5;i++) s += i<f ? '★' : (i<r ? '★' : '☆'); return `<span class="stars">${s}</span>`; };

// ===== STATE / ROUTER =====
let C = { route:'home' };
function nav(r){ C.route=r; render(); window.scrollTo(0,0); }
function toast(msg){ const t=document.getElementById('toast'); t.innerHTML=`<div class="toast">${msg}</div>`; clearTimeout(window._tt); window._tt=setTimeout(()=>t.innerHTML='',2600); }
function closeModal(e){ if(e && e.target!==e.currentTarget) return; document.getElementById('modal').innerHTML=''; }
function openAuth(){
  document.getElementById('modal').innerHTML = `
  <div class="modal-overlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <h3 style="margin-bottom:14px">Вход</h3>
      <input placeholder="Email">
      <input placeholder="Пароль" type="password">
      <button class="btn btn-primary" style="width:100%;margin-bottom:10px" onclick="closeModal();toast('Демо-режим: авторизация недоступна в превью')">Войти</button>
      <button class="btn btn-outline" style="width:100%;margin-bottom:6px" onclick="closeModal();toast('Демо-вход через Telegram (не подключено в превью)')">Войти через Telegram</button>
      <button class="btn btn-outline" style="width:100%" onclick="closeModal();toast('Демо-вход через Google (не подключено в превью)')">Войти через Google</button>
    </div>
  </div>`;
}

// ===== HEADER =====
function renderHeader(){
  document.getElementById('header').innerHTML = `
  <div class="header"><div class="header-inner">
    <a class="logo" href="#" onclick="nav('home');return false"><span class="logo-icon">К</span>КвартираСутки</a>
    <div class="header-search"><input placeholder="Город, район, метро…" onfocus="nav('search')"></div>
    <div class="header-actions">
      <a href="#" onclick="nav('host');return false">Разместить квартиру</a>
      <a href="#" onclick="nav('admin');return false">Админ</a>
      <a href="#" onclick="openAuth();return false">Войти</a>
      <button class="btn btn-primary btn-sm" onclick="nav('host')">Кабинет</button>
    </div>
  </div></div>`;
}

// ===== CARDS =====
function listingCard(l){
  return `
  <div class="card l-card">
    <div class="ph" style="cursor:pointer" onclick="nav('listing-${l.id}')">
      <img src="${photoUrl(l.photos[0])}" alt="${l.title}">
      <div class="fav" onclick="event.stopPropagation();toast('Добавлено в избранное')">♡</div>
    </div>
    <div class="body" style="cursor:pointer" onclick="nav('listing-${l.id}')">
      <div style="font-weight:700;margin-bottom:4px">${l.title}</div>
      <div class="meta">${l.city} · ${stars(l.rating)} (${l.reviews}) · до ${l.guests} гостей</div>
      <div class="price">${l.price.toLocaleString('ru-RU')} ₽ / сутки</div>
    </div>
  </div>`;
}

// ===== PAGES =====
function pageHome(){
  return `
  <div class="hero">
    <h1>Аренда квартир посуточно по всей России</h1>
    <p>Удобный поиск жилья напрямую от владельцев</p>
    <div class="search-form">
      <div class="row">
        <select><option>Любой город</option>${CITIES.map(c=>`<option>${c}</option>`).join('')}</select>
        <input type="date"><input type="date">
        <input placeholder="Гостей">
      </div>
      <button class="btn btn-primary" onclick="nav('search')">Найти жильё</button>
    </div>
    <div class="hero-links">
      <a href="#" class="solid" onclick="nav('search');return false">Смотреть все квартиры</a>
      <a href="#" onclick="nav('host');return false">Разместить квартиру</a>
    </div>
  </div>
  <div class="section">
    <h2>Популярные города</h2>
    <div class="grid grid-4">
      ${CITIES.map(c=>`<a href="#" class="card city-pill" onclick="nav('search');return false" style="font-weight:600">${c}</a>`).join('')}
    </div>
  </div>
  <div class="section">
    <h2>Лучшие предложения</h2>
    <div class="grid grid-3">${LISTINGS.slice(0,6).map(listingCard).join('')}</div>
  </div>`;
}

function pageSearch(){
  return `
  <div class="section">
    <h2>Квартиры посуточно</h2>
    <div class="filters">
      <select><option>Все города</option>${CITIES.map(c=>`<option>${c}</option>`).join('')}</select>
      <input placeholder="Цена от"><input placeholder="Цена до">
      <select><option>Любой тип</option><option>Квартира</option><option>Студия</option><option>Дом</option><option>Апартаменты</option></select>
      <select><option>Сначала популярные</option><option>Лучшие отзывы</option><option>Сначала дешевле</option><option>Сначала дороже</option></select>
      <button class="btn btn-outline" onclick="toast('Фильтры применены (демо)')">Применить</button>
    </div>
    <div class="grid grid-3">${LISTINGS.map(listingCard).join('')}</div>
  </div>`;
}

function pageListing(id){
  const l = getListing(id);
  if(!l) return `<div class="section"><p>Квартира не найдена. <a href="#" onclick="nav('search');return false" style="color:var(--brand)">К поиску</a></p></div>`;
  const cal = (()=>{ const wd=['Пн','Вт','Ср','Чт','Пт','Сб','Вс']; let html=wd.map(w=>`<span class="wd">${w}</span>`).join('');
    const start=(new Date().getDay()+6)%7; for(let i=0;i<start;i++) html+='<span></span>';
    const days=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate();
    for(let d=1;d<=days;d++) html+=`<span class="d ${[3,4,11,12,18].includes(d)?'busy':'free'}">${d}</span>`;
    return html; })();
  return `
  <div class="section">
    <a href="#" onclick="nav('search');return false" style="color:var(--ink-500);font-size:13px">← Ко всем квартирам</a>
    <h2 style="margin-top:10px">${l.title}</h2>
    <div class="meta" style="margin-bottom:20px">${stars(l.rating)} (${l.reviews} отзывов) · ${l.city}</div>
    <div class="gallery">
      ${l.photos.map(p=>`<img src="${photoUrl(p)}" alt="">`).join('')}
    </div>
    <div class="detail-grid">
      <div>
        <h3 style="margin-bottom:10px">Описание</h3>
        <p style="color:var(--ink-700);margin-bottom:26px">${l.desc}</p>
        <h3 style="margin-bottom:10px">Характеристики</h3>
        <div class="chars">
          <p>Тип: ${l.cat}</p><p>Комнат: ${l.rooms}</p><p>Спальных мест: ${l.beds}</p>
          <p>Площадь: ${l.area} м²</p><p>Этаж: ${l.floor}</p><p>Вид: ${l.view}</p>
          <p>Гостей: до ${l.guests}</p><p>Балкон: ${l.balcony?'есть':'нет'}</p><p>Лифт: ${l.elevator?'есть':'нет'}</p>
        </div>
        <h3 style="margin-bottom:10px">Удобства</h3>
        <div class="amen">${l.amen.map(a=>`<span>${a}</span>`).join('')}</div>
        <h3 style="margin-bottom:10px">Свободные даты</h3>
        <div class="cal">${cal}</div>
        <h3 style="margin-bottom:10px">Расположение</h3>
        <div class="map-box"><span style="font-size:24px">📍</span>Карта (Leaflet / OpenStreetMap)<span>${l.city}</span></div>
        <h3 style="margin-bottom:10px">Отзывы (${l.reviews})</h3>
        ${REVIEW_TEXTS.slice(0,3).map(t=>`<div class="review">${stars(5)}<p style="margin-top:6px">${t}</p></div>`).join('')}
      </div>
      <div>
        <div class="card booking-box">
          <div style="font-size:18px;font-weight:800">${l.price.toLocaleString('ru-RU')} ₽ / сутки</div>
          <div class="row2"><input type="date"><input type="date"></div>
          <input placeholder="Гостей">

function render(){
  renderHeader();
  const r = C.route;
  let html;
  if(r === 'home') html = pageHome();
  else if(r === 'search') html = pageSearch();
  else if(r.startsWith('listing-')) html = pageListing(parseInt(r.split('-')[1]));
  else if(r === 'host') html = pageHost();
  else if(r === 'admin') html = pageAdmin();
  else html = pageHome();
  document.getElementById('content').innerHTML = html;
}
render();
